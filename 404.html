<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
</head>
    <style>
        body { background-color: #111111; }
        div {
            margin-top: 0px;
            padding: 40px;
            font-size: 95px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            font-family: 'Monoton', cursive;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 80px red, 0 0 30px firebrick, 0 0 6px darkred;
            color: red;
        }
            div p { margin: 5px; }
        #error { color: #FFFFFF; text-shadow: 0 0 80px #FFFFFF, 0 0 30px #008000, 0 0 6px #0000FF; }
            #error:hover { text-shadow: 0 0 200px #FFFFFF, 0 0 80px #008000, 0 0 6px #0000FF; }
            #error span { animation: upper 11s linear infinite; }
                @keyframes upper {
                    0%, 19.999%, 62.999%, 70%, 100% { opacity: .99; text-shadow: 0 0 80px #FFFFFF, 0 0 30px #008000, 0 0 6px #0000FF; }
                    20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: .4; text-shadow: none; }
                }
        #code:hover { text-shadow: 0 0 100px red, 0 0 40px firebrick, 0 0 8px darkred; }
        #code span:nth-of-type(2) { animation: lower 10s linear infinite; }
        #code span:nth-of-type(1) { text-shadow: none; opacity: .4; }
            @keyframes lower {
                0%, 12%, 18.999%, 23%, 31.999%, 46%, 49.999%, 51%, 58.999%, 68.999%, 71%, 78.999%, 96%, 100% { opacity: .99; text-shadow: 0 0 80px red, 0 0 30px firebrick, 0 0 6px darkred; }
                19%, 22.999%, 32%, 36.999%, 50%, 55.999%, 64%, 69.999%, 86%, 89.999% { opacity: .4; text-shadow: none; }
            }

        @media(max-width: 520px) {
            div { font-size: 60px; }
        }
        @media(max-width: 380px) {
            div { font-size: 45px; }
        }
    </style>
<body>
      <div>
        <p id="error">E <span>r</span>ror</p>
        <p id="code">4<span>0</span><span>4</span></p>
    </div>      
</body>
</html>
